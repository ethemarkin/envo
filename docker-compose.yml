name: envo

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: envo
      POSTGRES_PASSWORD: envo
      POSTGRES_DB: envo
    volumes:
      - ./db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envo -d envo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # API and dashboard in one container. Port 4400 is published for the
  # reverse proxy (Nginx Proxy Manager), which terminates TLS.
  envo:
    image: earkin/envo
    build: .
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVO_DATABASE_URL: postgresql+asyncpg://envo:envo@db:5432/envo
    ports:
      - "4400:8000"
    depends_on:
      db:
        condition: service_healthy

